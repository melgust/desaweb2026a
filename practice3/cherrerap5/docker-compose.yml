services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  order-service:
    build: ./order-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      ORDER_TTL_SECONDS: 86400
      CATALOG_SERVICE_URL: http://catalog-service:8080
      BACKEND_SERVICE_URL: http://backend:80
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_ISSUER: EnterpriseApi
      JWT_AUDIENCE: EnterpriseApp
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:81
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  mongo:
    image: mongo:8.0
    container_name: enterprise_catalog_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enterprise_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: enterprise_catalog_service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/catalog_db
      CATALOG_SEED_PRODUCT_COUNT: 75
      CATALOG_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:81
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - enterprise_network

  db:
    image: mysql:8.0
    container_name: enterprise_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourSecurePassword123!
      MYSQL_DATABASE: EnterpriseDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - enterprise_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_backend
    restart: always
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseDb;User Id=root;Password=YourSecurePassword123!;
      - CatalogService__BaseUrl=http://catalog-service:8080/
      - Jwt__Key=${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
    depends_on:
      db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - enterprise_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      order-service:
        condition: service_healthy
      backend:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

volumes:
  redis_data:
  db_data:
  mongo_data:

networks:
  enterprise_network:
    driver: bridge
