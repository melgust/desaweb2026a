services:
  mongo:
    image: mongo:8.0
    container_name: enterprise_catalog_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enterprise_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: enterprise_catalog_service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/catalog_db
      CATALOG_SEED_PRODUCT_COUNT: 75
      CATALOG_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:81
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - enterprise_network

  db:
    image: mysql:8.0
    container_name: enterprise_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourSecurePassword123!
      MYSQL_DATABASE: EnterpriseDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - enterprise_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_backend
    restart: always
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseDb;User Id=root;Password=YourSecurePassword123!;
      - CatalogService__BaseUrl=http://catalog-service:8080/
    depends_on:
      db:
        condition: service_started
      catalog-service:
        condition: service_healthy
    networks:
      - enterprise_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      backend:
        condition: service_started
      catalog-service:
        condition: service_healthy
    networks:
      - enterprise_network

volumes:
  db_data:
  mongo_data:

networks:
  enterprise_network:
    driver: bridge
