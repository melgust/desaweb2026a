spring:
  application:
    name: catalog-service
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/catalog_db}}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

catalog:
  seed:
    product-count: ${CATALOG_SEED_PRODUCT_COUNT:75}
  cors:
    allowed-origins: ${CATALOG_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:81}
