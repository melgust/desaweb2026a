<div class="container">
  <header class="header">
    <h2>Enterprise Products</h2>
    <a *ngIf="auth.canManageProducts()" routerLink="/products/new" class="btn btn-primary">+ Add Product</a>
  </header>

  <div class="toolbar">
    <input type="text" placeholder="Search products... (press Enter)" [(ngModel)]="searchTerm" (keyup.enter)="onSearchChange()" class="search-bar" />

    <div class="view-toggle" aria-label="Pagination mode selector">
      <button type="button" [class.active]="paginationMode() === 'offset'" (click)="switchMode('offset')">Offset Pagination</button>
      <button type="button" [class.active]="paginationMode() === 'infinite'" (click)="switchMode('infinite')">Scroll infinito</button>
    </div>
  </div>

  <table class="grid-table" *ngIf="!loading() || products().length > 0; else loadingTpl">
    <thead>
      <tr>
        <th (click)="toggleSort('name')">Name</th>
        <th>Description</th>
        <th (click)="toggleSort('price')">Price</th>
        <th (click)="toggleSort('stock')">Stock</th>
        <th *ngIf="auth.canManageProducts()">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of products()">
        <td>{{ item.name }}</td>
        <td>{{ item.description || '-' }}</td>
        <td>\${{ item.price | number:'1.2-2' }}</td>
        <td>{{ item.stock }}</td>
        <td *ngIf="auth.canManageProducts()">
          <a [routerLink]="['/products/edit', item.id]">Edit</a>
          <button *ngIf="auth.canDeleteProducts()" (click)="deleteProduct(item.id)" class="text-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" *ngIf="paginationMode() === 'offset'">
    <button [disabled]="page() <= 1" (click)="setPage(page() - 1)">Prev</button>
    <span>Page {{ page() }} of {{ totalPages() || 1 }}</span>
    <button [disabled]="page() >= totalPages() || totalPages() === 0" (click)="setPage(page() + 1)">Next</button>
  </div>

  <div class="infinite-status" *ngIf="paginationMode() === 'infinite'">
    <div *ngIf="loading()">Loading more products...</div>
    <button *ngIf="!loading() && hasMore()" type="button" (click)="loadMore()">Load more</button>
    <div *ngIf="!hasMore() && products().length > 0">No more products to show.</div>
  </div>

  <ng-template #loadingTpl><div>Loading data...</div></ng-template>
</div>
