<div class="login-wrapper">
  <div class="login-card">
    <h2>Sign In</h2>
    <p class="subtitle">Access Enterprise Management System</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control"
          placeholder="admin@enterprise.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" routerLink="/products"  [disabled]="loading" class="btn btn-primary btn-block">
        <!-- {{ loading ? '/products' : '/products' }} -->
      </button>
    </form>
  </div>
</div>
