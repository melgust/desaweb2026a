<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title mb-0">Enterprise Products</h3>
    <a *ngIf="auth.canManageProducts()" routerLink="/products/new" class="btn btn-primary btn-sm">
      + Add Product
    </a>
  </div>

  <div class="card-body">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search products</mat-label>
      <input matInput placeholder="Type and press Enter"
             [(ngModel)]="searchTerm" (keyup.enter)="onSearchChange()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <div class="mat-elevation-z1 table-container">
      <table mat-table [dataSource]="products()" matSort (matSortChange)="onSortChange($event)"
             [matSortActive]="sortBy" [matSortDirection]="sortDirection">

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let item">{{ item.description || '-' }}</td>
        </ng-container>

        <!-- Price -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
          <td mat-cell *matCellDef="let item">{{ item.price | currency }}</td>
        </ng-container>

        <!-- Stock -->
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
          <td mat-cell *matCellDef="let item">{{ item.stock }}</td>
        </ng-container>

        <!-- Supplier -->
        <ng-container matColumnDef="supplier">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Supplier</th>
          <td mat-cell *matCellDef="let item">{{ item.supplierName || '-' }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item">
            <a mat-icon-button color="primary" [routerLink]="['/products/edit', item.id]" title="Edit">
              <mat-icon>edit</mat-icon>
            </a>
            <button *ngIf="auth.canDeleteProducts()" mat-icon-button color="warn"
                    (click)="deleteProduct(item.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center py-3" [attr.colspan]="displayedColumns.length">
            {{ loading() ? 'Loading data...' : 'No products found.' }}
          </td>
        </tr>
      </table>

      <mat-paginator [length]="totalItems()"
                     [pageIndex]="pageIndex"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="pageSizeOptions"
                     (page)="onPageChange($event)"
                     showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
</div>
