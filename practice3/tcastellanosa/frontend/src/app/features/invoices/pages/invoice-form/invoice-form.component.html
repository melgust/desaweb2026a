<div class="container"><header class="header"><h2>Registrar factura de compra</h2><a routerLink="/invoices" class="btn">Regresar</a></header><p *ngIf="error" class="form-error">{{ error }}</p>
  <form *ngIf="!loading; else loadingTpl" (ngSubmit)="submit()"><div class="form-row"><div class="form-group col"><label>Número de factura</label><input [(ngModel)]="formData.invoiceNumber" name="invoiceNumber" class="form-control" required maxlength="50"></div><div class="form-group col"><label>Fecha</label><input [(ngModel)]="formData.invoiceDate" name="invoiceDate" class="form-control" type="date" required></div></div><div class="form-group"><label>Proveedor</label><select [(ngModel)]="formData.supplierId" name="supplierId" class="form-control" required><option value="">Seleccione un proveedor</option><option *ngFor="let supplier of suppliers" [value]="supplier.id">{{ supplier.name }}</option></select></div>
    <h3>Detalles de factura</h3><div class="detail-row" *ngFor="let detail of formData.details; let i = index"><select [(ngModel)]="detail.productId" [name]="'product' + i" class="form-control" required><option value="">Producto</option><option *ngFor="let product of products" [value]="product.id">{{ product.name }} (existencia: {{ product.stock }})</option></select><input [(ngModel)]="detail.quantity" [name]="'quantity' + i" class="form-control" type="number" min="1" placeholder="Cantidad" required><input [(ngModel)]="detail.unitPrice" [name]="'price' + i" class="form-control" type="number" min="0.01" step="0.01" placeholder="Precio unitario" required><button type="button" class="text-danger" (click)="removeDetail(i)">Eliminar</button></div><button type="button" class="btn" (click)="addDetail()">+ Agregar detalle</button><p class="invoice-total">Total: ${{ total() | number:'1.2-2' }}</p><button class="btn btn-primary" [disabled]="saving">{{ saving ? 'Guardando...' : 'Registrar factura' }}</button>
  </form><ng-template #loadingTpl><p>Cargando datos del formulario...</p></ng-template>
</div>
