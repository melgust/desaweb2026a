<div class="container"><header class="header"><h2>{{ id ? 'Editar proveedor' : 'Nuevo proveedor' }}</h2><a routerLink="/suppliers" class="btn">Regresar</a></header>
  <p *ngIf="error" class="form-error">{{ error }}</p><form (ngSubmit)="submit()"><div class="form-group"><label>Nombre</label><input [(ngModel)]="formData.name" name="name" class="form-control" required maxlength="150"></div><div class="form-row"><div class="form-group col"><label>NIT</label><input [(ngModel)]="formData.taxId" name="taxId" class="form-control" maxlength="30"></div><div class="form-group col"><label>Teléfono</label><input [(ngModel)]="formData.phone" name="phone" class="form-control" maxlength="30"></div></div><div class="form-group"><label>Correo</label><input [(ngModel)]="formData.email" name="email" class="form-control" type="email" maxlength="150"></div><div class="form-group checkbox-group"><label><input [(ngModel)]="formData.isActive" name="isActive" type="checkbox"> Activo</label></div><button class="btn btn-primary" [disabled]="loading">{{ loading ? 'Guardando...' : 'Guardar proveedor' }}</button></form>
</div>
