<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title mb-0">Categories</h3>
    <a routerLink="/categories/new" class="btn btn-primary btn-sm">+ Add Category</a>
  </div>
  <div class="card-body">
    <mat-form-field appearance="outline" class="search-field w-100">
      <mat-label>Search categories</mat-label>
      <input matInput placeholder="Type and press Enter" [(ngModel)]="searchTerm" (keyup.enter)="onSearchChange()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <div class="mat-elevation-z1 table-container">
      <table mat-table [dataSource]="categories()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge" [class.bg-success]="item.isActive" [class.bg-secondary]="!item.isActive">
              {{ item.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item">
            <a mat-icon-button color="primary" [routerLink]="['/categories/edit', item.id]" title="Edit">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button color="warn" (click)="deleteCategory(item.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center py-3" [attr.colspan]="displayedColumns.length">
            {{ loading() ? 'Loading data...' : 'No categories found.' }}
          </td>
        </tr>
      </table>

      <mat-paginator [length]="totalItems()" [pageIndex]="pageIndex" [pageSize]="pageSize"
                     [pageSizeOptions]="pageSizeOptions" (page)="onPageChange($event)" showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
</div>
