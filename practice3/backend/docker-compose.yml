services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practice3-api
    ports:
      - "80:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=practice3;User=root;Password=YourSecurePassword123!"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: practice3-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "YourSecurePassword123!"
      MYSQL_DATABASE: practice3
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pYourSecurePassword123!"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
