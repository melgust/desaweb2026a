<div class="container">
  <header class="header">
    <h2>{{ isEditMode ? 'Edit Category' : 'Create New Category' }}</h2>
    <a routerLink="/categories" class="btn">Back to List</a>
  </header>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()" *ngIf="!loading; else loadingTpl">
    <div class="form-group">
      <label for="name">Category Name</label>
      <input type="text" id="name" [(ngModel)]="formData.name" name="name" class="form-control" required />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="formData.description" name="description" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      {{ isEditMode ? 'Update Category' : 'Create Category' }}
    </button>
  </form>

  <ng-template #loadingTpl>
    <div>Loading form data...</div>
  </ng-template>
</div>
