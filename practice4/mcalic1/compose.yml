services:
  postgres:
    image: postgres:18-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalog
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: catalog
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
