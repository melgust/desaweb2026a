spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# The datasource URL/credentials are supplied dynamically by Testcontainers
# (see AbstractPostgresIntegrationTest / @ServiceConnection). PostgreSQL is used
# for tests as well - H2 is intentionally never used.
