spring:
  application:
    name: catalog-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DATABASE_USERNAME:catalog}
    password: ${DATABASE_PASSWORD:catalog}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only expose what we need; do not expose everything.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: catalog-service
    description: Catalog microservice for an online store
    security: "DISABLED (no OAuth2/OIDC/JWT, no API Gateway) - current stage"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
