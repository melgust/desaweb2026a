version: '3.8'

services:
  app:
    build: .
    container_name: factunet-app
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/factunet
      SPRING_APPLICATION_NAME: factunet

  mongodb:
    image: mongo:7
    container_name: factunet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
