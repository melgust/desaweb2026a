services:

  mongodb:
    image: mongo:8.0
    container_name: catalog-mongodb

    environment:
      MONGO_INITDB_DATABASE: catalog

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: catalog-service

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/catalog?uuidRepresentation=standard
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  mongodb-data: